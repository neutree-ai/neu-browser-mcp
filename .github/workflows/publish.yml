name: Publish

# Publishes to npm through trusted publishing: npm trusts this workflow in this
# repository, so no token is stored. Provenance is attached automatically.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing needs a recent npm; do not rely on the bundled one.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm publish --access public
